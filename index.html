<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SKUL — Streetwear</title>
    <meta name="description" content="SKUL — ropa streetwear en Los Toldos, Buenos Aires." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Tipografía: misma familia que usa la referencia (Arimo, métrica
         compatible con Helvetica/Arial). Si no carga, el CSS ya tiene
         Helvetica / Arial / sans-serif como respaldo. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400;0,500;0,600;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
    />

    <!-- Cómo se ve el link cuando lo compartís por WhatsApp/Instagram/Facebook -->
    <!-- OJO: las plataformas sociales NO aceptan SVG para la imagen de
         vista previa (WhatsApp y Facebook muestran un recuadro vacío).
         Por eso la captura es un PNG de 1200x630px en /og-image.png.
         Y tiene que ser una URL ABSOLUTA: con una ruta relativa
         ("/og-image.png") muchos lectores no la encuentran. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://skullt.web.app/" />
    <meta property="og:site_name" content="SKUL" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:title" content="SKUL — Streetwear" />
    <meta property="og:description" content="Ropa streetwear en Los Toldos, Buenos Aires. Hoodies, sweaters, denim y más." />
    <meta property="og:image" content="https://skullt.web.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SKUL — Streetwear" />
    <meta name="twitter:description" content="Ropa streetwear en Los Toldos, Buenos Aires." />
    <meta name="twitter:image" content="https://skullt.web.app/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
